<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Budget Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Beautiful Floating Glass Account Access Panel View Screen Component -->
    <div id="auth-container" class="container" style="margin-bottom: 20px;">
        <h2 id="auth-title" style="text-align: center; color: #2c3e50;">🔒 Secure Account Gateway</h2>
        <div class="input-box" style="flex-direction: column; gap: 12px;">
            <input type="text" id="auth-user" placeholder="Create your unique profile account username...">
            <input type="password" id="auth-pass" placeholder="Enter password protection layout parameter tokens...">
            <div style="display: flex; gap: 10px; width: 100%;">
                <button id="login-btn" style="flex: 1; background: #3498db;">Sign In</button>
                <button id="register-btn" style="flex: 1; background: #7f8c8d;">Sign Up</button>
            </div>
        </div>
    </div>

    <!-- Wrap your existing tracker hub container inside a hidden wrapper container state block -->
    <div id="app-container" class="container" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span id="welcome-banner" style="font-weight: bold; color: #2c3e50;">Welcome Back!</span>
            <button id="logout-btn" style="background: #e74c3c; padding: 6px 12px; font-size: 12px;">Logout</button>
        </div>
        <!-- ... Leave your full tracking grids, statistics cards, and canvas history lists blocks inside exactly the same as before ... -->

    <div class="container">
        <h1>📊 Cloud Budget Tracker</h1>
        
        <!-- Input section for both Name and Cost -->
        <div class="input-box">
    <input type="text" id="item-input" placeholder="Expense name (e.g., Grocery)">
    <input type="number" id="amount-input" placeholder="₱ Amount" step="0.01">
    
    <!-- New Category Selection Dropdown Menu -->
    <select id="category-input">
        <option value="🍔 Food">🍔 Food</option>
        <option value="🚗 Transport">🚗 Transport</option>
        <option value="💡 Bills">💡 Bills</option>
        <option value="🎮 Entertainment">🎮 Fun</option>
    </select>
    
    <button id="submit-btn">Add Expense</button>
</div>

        <!-- Metric Displays for Timeframes -->
        <div class="stats-grid">
            <div class="stat-card">
                <h4>📅 This Week</h4>
                <p id="total-weekly">₱0.00</p>
            </div>
            <div class="stat-card">
                <h4>🗓️ This Month</h4>
                <p id="total-monthly">₱0.00</p>
            </div>
            <div class="stat-card">
                <h4>🌟 This Year</h4>
                <p id="total-yearly">₱0.00</p>
            </div>
        </div>

        <h3>Recent History:</h3>
        <ul id="items-list"></ul>
    </div>

    <script src="/script.js"></script>
</body>
</html>
