
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Cloud Budget Suite</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="auth-container" class="container">
        <h2>🔒 Secure Account Gateway</h2>
        <div class="input-box" style="flex-direction: column; gap: 12px;">
            <input type="text" id="auth-user" placeholder="Create your unique profile account username...">
            <input type="password" id="auth-pass" placeholder="Enter password protection layout parameter tokens...">
            <div style="display: flex; gap: 10px; width: 100%;">
                <button id="login-btn" style="flex: 1;">Sign In</button>
                <button id="register-btn" style="flex: 1;">Sign Up</button>
            </div>
        </div>
    </div>
    <div id="app-container" class="container" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span id="welcome-banner" style="font-weight: bold; color: #2c3e50;">Welcome Back!</span>
            <button id="logout-btn">Logout</button>
        </div>
        <h1>📊 Cloud Budget Tracker</h1>
        <div class="input-box">
            <input type="text" id="item-input" placeholder="Expense name (e.g., Grocery)">
            <input type="number" id="amount-input" placeholder="₱ Amount" step="0.01">
            <select id="category-input">
                <option value="🍔 Food">🍔 Food</option>
                <option value="🚗 Transport">🚗 Transport</option>
                <option value="💡 Bills">💡 Bills</option>
                <option value="🎮 Entertainment">🎮 Fun</option>
            </select>
            <button id="submit-btn">Add Expense</button>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <h4>📅 This Week</h4>
                <p id="total-weekly">₱0.00</p>
            </div>
             <!-- ✨ PERFECTLY BALANCED: Single 4-Column Timeframe Stats Grid Row -->
        <div class="stats-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 30px;">
            <div class="stat-card" style="padding: 10px 2px;">
                <h4 style="font-size: 10px; margin: 0 0 4px 0;">☀️ Today</h4>
                <p id="total-daily" style="font-size: 13px; font-weight: bold; margin: 0;">₱0.00</p>
            </div>
            <div class="stat-card" style="padding: 10px 2px;">
                <h4 style="font-size: 10px; margin: 0 0 4px 0;">📅 This Week</h4>
                <p id="total-weekly" style="font-size: 13px; font-weight: bold; margin: 0;">₱0.00</p>
            </div>
            <div class="stat-card" style="padding: 10px 2px;">
                <h4 style="font-size: 10px; margin: 0 0 4px 0;">🗓️ This Month</h4>
                <p id="total-monthly" style="font-size: 13px; font-weight: bold; margin: 0;">₱0.00</p>
            </div>
            <div class="stat-card" style="padding: 10px 2px;">
                <h4 style="font-size: 10px; margin: 0 0 4px 0;">🌟 This Year</h4>
                <p id="total-yearly" style="font-size: 13px; font-weight: bold; margin: 0;">₱0.00</p>
            </div>
        </div>
 <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3>Recent History:</h3>
            <button id="export-btn" style="background-color: #34495e; padding: 8px 16px; font-size: 12px; border-radius: 30px; color: white; border: none; cursor: pointer;">📥 Export Ledger (.CSV)</button>
        </div>
        <ul id="items-list"></ul>
    </div>
    <script src="/script.js"></script>
</body>
</html>
