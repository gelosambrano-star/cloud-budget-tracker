<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Budget Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div class="container">
        <h1>📊 Cloud Budget Tracker</h1>
        
        <!-- Input section for both Name and Cost -->
        <div class="input-box">
    <input type="text" id="item-input" placeholder="Expense name (e.g., Grocery)">
    <input type="number" id="amount-input" placeholder="₱ Amount" step="0.01">
    
    <!-- New Category Selection Dropdown Menu -->
    <select id="category-input">
        <option value="🍔 Food">🍔 Food</option>
        <option value="🚗 Transport">🚗 Transport</option>
        <option value="💡 Bills">💡 Bills</option>
        <option value="🎮 Entertainment">🎮 Fun</option>
    </select>
    
    <button id="submit-btn">Add Expense</button>
</div>

        <!-- Metric Displays for Timeframes -->
        <div class="stats-grid">
            <div class="stat-card">
                <h4>📅 This Week</h4>
                <p id="total-weekly">₱0.00</p>
            </div>
            <div class="stat-card">
                <h4>🗓️ This Month</h4>
                <p id="total-monthly">₱0.00</p>
            </div>
            <div class="stat-card">
                <h4>🌟 This Year</h4>
                <p id="total-yearly">₱0.00</p>
            </div>
        </div>

        <h3>Recent History:</h3>
        <ul id="items-list"></ul>
    </div>

    <script src="/script.js"></script>
</body>
</html>
